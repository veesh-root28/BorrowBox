name: Deploy BorrowBox to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/BorrowBox
            git pull origin main

            sudo docker stop borrowbox || true
            sudo docker rm borrowbox || true

            sudo docker build -t borrowbox .

            sudo docker run -d \
              --name borrowbox \
              -p 3000:3000 \
              borrowbox

            sleep 5

            curl -f http://localhost:3000/health
